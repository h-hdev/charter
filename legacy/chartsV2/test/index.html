<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>

<body>
	<div id="container" style="width: 600px;height: 400px;border: 1px solid #ddd"></div>
	<script src="http://code.highcharts.com.cn/highcharts/highcharts.js"></script>
	<script>

		let renderer = new Highcharts.Renderer(document.getElementById('container'), 600, 400);


		renderer.path(['M', 50, 0, 'L', 50, 400, 'M', 0, 50, 'L', 600, 50]).attr({
			stroke: 'red',
			'stroke-width': 1
		}).add();

		let text = renderer.text()
			.attr({
 "text": "P0_RvsP0_L",
 "x": 0,
 "y": 0,
 "translateX": 0,
 "translateY": 180,
 "rotation": 290
})
			.css(
				{
 "fontSize": "14px",
 "color": "#000",
 "text-anchor": "start",
 "dominant-baseline": "ideographic",
 "fill": "#000"
}
			).add();
	</script>
</body>

</html>
